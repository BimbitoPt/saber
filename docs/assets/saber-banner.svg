<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Saber — desktop studio for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101012"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58BCFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6E6EA" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="16" fill="url(#glow)"/>

  <!-- diagonal light beam -->
  <polygon points="560,360 640,360 1040,0 960,0" fill="url(#beam)" filter="url(#soft)"/>
  <line x1="600" y1="360" x2="1000" y2="0" stroke="#58BCFF" stroke-opacity="0.25"/>

  <!-- S mark -->
  <g transform="translate(96,96)">
    <polygon points="0,64 112,8 112,60 0,116" fill="#3B82F6"/>
    <polygon points="0,116 40,96 76,112 0,132" fill="#1F2937"/>
    <polygon points="0,132 76,94 112,112 112,124 0,180" fill="#E6E6EA"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="180" font-family="Manrope, 'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="96" font-weight="800" letter-spacing="4" fill="#E6E6EA">SABER</text>
  <text x="252" y="226" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="500" fill="#9CA3AF">Desktop studio for AI coding agents. <tspan fill="#58BCFF">Work with intent.</tspan></text>

  <!-- stack chips -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#E6E6EA">
    <rect x="252" y="256" width="104" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="304" y="276" text-anchor="middle">Tauri v2</text>
    <rect x="366" y="256" width="66" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="399" y="276" text-anchor="middle">Bun</text>
    <rect x="442" y="256" width="150" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="517" y="276" text-anchor="middle">TanStack Start</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(900,70)">
    <rect width="308" height="220" rx="12" fill="#101012" stroke="#27272A"/>
    <circle cx="20" cy="20" r="5" fill="#3F3F46"/>
    <circle cx="38" cy="20" r="5" fill="#3F3F46"/>
    <circle cx="56" cy="20" r="5" fill="#3F3F46"/>
    <line x1="0" y1="40" x2="308" y2="40" stroke="#27272A"/>
    <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#E6E6EA">
      <text x="20" y="72"><tspan fill="#58BCFF">$</tspan> saber run</text>
      <text x="20" y="102"><tspan fill="#58BCFF">→</tspan> Planning tasks…</text>
      <text x="20" y="128"><tspan fill="#58BCFF">→</tspan> Spawning agents…</text>
      <text x="20" y="154"><tspan fill="#58BCFF">→</tspan> Verifying changes…</text>
      <text x="20" y="186" fill="#4ADE80">✓ All tasks completed.</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="16" fill="none" stroke="#E6E6EA" stroke-opacity="0.06"/>
</svg>
