<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Saber - Terminal-First Workspace for Agentic Engineering">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1200" height="300" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Decorative left shape -->
  <path d="M0 0 L0 300 L150 150 Z" fill="#764ba2" opacity="0.8"/>
  
  <!-- Decorative right shape -->
  <path d="M1050 0 L1050 300 L1200 150 Z" fill="#f5576c" opacity="0.8"/>
  
  <!-- Main title -->
  <text x="60" y="70" font-family="Inter, system-ui, -apple-sans-serif, sans-serif" font-size="48" font-weight="bold" fill="white">Saber</text>
  
  <!-- Subtitle -->
  <text x="60" y="110" font-family="Inter, system-ui, -apple-sans-serif, sans-serif" font-size="24" fill="#ffd8a9">Terminal-First Workspace for Agentic Engineering</text>
  
  <!-- Description -->
  <text x="60" y="160" font-family="Inter, system-ui, -apple-sans-serif, sans-serif" font-size="18" fill="#e0e7ff">Open a task's shell, type commands for any local tool, and switch tasks while keeping each task's specification and handoff close at hand.</text>
  
  <!-- Tech badges -->
  <g transform="translate(60, 220)">
    <circle cx="12" cy="12" r="8" fill="#f5576c" opacity="0.9"/>
    <text x="28" y="20" font-family="Inter, system-ui, -apple-sans-serif, sans-serif" font-size="12" fill="white">Bun</text>
    
    <circle cx="56" cy="12" r="8" fill="#764ba2" opacity="0.9"/>
    <text x="72" y="20" font-family="Inter, system-ui, -apple-sans-serif, sans-serif" font-size="12" fill="white">Tauri</text>
    
    <circle cx="100" cy="12" r="8" fill="#667eea" opacity="0.9"/>
    <text x="116" y="20" font-family="Inter, system-ui, -apple-sans-serif, sans-serif" font-size="12" fill="white">TypeScript</text>
  </g>
  
  <!-- Footer accent -->
  <rect x="0" y="290" width="1200" height="10" fill="url(#grad2)"/>
  
  <!-- GitHub link hint -->
  <text x="60" y="260" font-family="Inter, system-ui, -apple-sans-serif, sans-serif" font-size="14" fill="#7f8c8d" opacity="0.6">github.com/BimbitoPt/saber</text>
</svg>